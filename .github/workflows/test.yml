name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fonts with the same metrics as Arial, Calibri, Cambria and Times New Roman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Install
        run: pip install -r slidewell/requirements.txt pytest
      - name: Rebuild every example and run the checker on it
        run: pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate .

  release-zip:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build slidewell.zip for claude.ai upload
        run: zip -qr slidewell.zip slidewell -x "*/__pycache__/*" "*_render/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: slidewell.zip
